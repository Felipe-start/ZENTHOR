<div class="chat-container">
  <div class="chat-header">
    <div class="header-info">
      <i class="fas fa-robot"></i>
      <div>
        <h2>ZENTHOR AI Assistant</h2>
        <p>Potenciado por Groq Llama 3 | RAG con tus documentos</p>
      </div>
    </div>
    <button class="btn-clear" (click)="limpiarChat()" title="Limpiar chat">
      <i class="fas fa-trash-alt"></i>
    </button>
  </div>

  <div class="chat-messages" #chatMessages>
    <div *ngFor="let msg of mensajes" class="message" [class.user]="msg.rol === 'usuario'" [class.assistant]="msg.rol === 'asistente'">
      <div class="message-avatar">
        <i *ngIf="msg.rol === 'asistente'" class="fas fa-robot"></i>
        <i *ngIf="msg.rol === 'usuario'" class="fas fa-user"></i>
      </div>
      <div class="message-content">
        <div class="message-text" [innerHTML]="msg.contenido | markdown"></div>
        <div class="message-fuentes" *ngIf="msg.fuentes && msg.fuentes.length > 0">
          <button class="btn-fuentes" (click)="mostrarFuentes(msg.fuentes)">
            <i class="fas fa-book-open"></i> Ver fuentes ({{ msg.fuentes.length }})
          </button>
        </div>
      </div>
    </div>

    <div *ngIf="cargando" class="message assistant">
      <div class="message-avatar">
        <i class="fas fa-robot"></i>
      </div>
      <div class="message-content">
        <div class="typing-indicator">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>
  </div>

  <div class="chat-input">
    <textarea 
      [(ngModel)]="preguntaActual" 
      (keydown.enter)="enviarMensaje(); $event.preventDefault()"
      placeholder="Escribe tu pregunta... (Presiona Enter para enviar)"
      rows="1"
    ></textarea>
    <button (click)="enviarMensaje()" [disabled]="!preguntaActual.trim() || cargando">
      <i class="fas fa-paper-plane"></i>
    </button>
  </div>
</div>

<!-- Modal de fuentes -->
<div class="modal" *ngIf="mostrandoFuentes" (click)="mostrandoFuentes = false">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3><i class="fas fa-book-open"></i> Documentos de referencia</h3>
      <button class="close" (click)="mostrandoFuentes = false">&times;</button>
    </div>
    <div class="modal-body">
      <div *ngFor="let fuente of fuenteSeleccionada" class="fuente-item">
        <div class="fuente-titulo">
          <i class="fas fa-file-alt"></i>
          <strong>{{ fuente.titulo }}</strong>
        </div>
        <div class="fuente-detalle">
          <span class="badge">Fuente: {{ fuente.fuente }}</span>
          <span class="badge" *ngIf="fuente.similitud">Similitud: {{ (fuente.similitud * 100).toFixed(1) }}%</span>
        </div>
      </div>
    </div>
  </div>
</div>
