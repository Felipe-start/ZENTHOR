<div class="auth-container">
  <div class="auth-card animate-scale">
    <div class="auth-header">
      <div class="logo-container">
        <img 
          src="assets/images/ LOGO.jpg" 
          alt="ZENTHOR Logo" 
          class="logo animate-float"
          (error)="handleImageError($event)"
        >
      </div>
      <h1>Crear Cuenta</h1>
      <p>Únete a ZENTHOR y organiza tu vida académica</p>
    </div>
    
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="nombre_completo">Nombre completo</label>
        <div class="input-group">
          <i class="fas fa-user"></i>
          <input 
            type="text" 
            id="nombre_completo" 
            formControlName="nombre_completo" 
            placeholder="María García López"
            [class.is-invalid]="registerForm.get('nombre_completo')?.invalid && registerForm.get('nombre_completo')?.touched"
          >
        </div>
        <div class="invalid-feedback" *ngIf="registerForm.get('nombre_completo')?.invalid && registerForm.get('nombre_completo')?.touched">
          <i class="fas fa-exclamation-circle"></i>
          El nombre completo es requerido (mínimo 3 caracteres)
        </div>
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <div class="input-group">
          <i class="fas fa-envelope"></i>
          <input 
            type="email" 
            id="email" 
            formControlName="email" 
            placeholder="tu@email.com"
            [class.is-invalid]="registerForm.get('email')?.invalid && registerForm.get('email')?.touched"
          >
        </div>
        <div class="invalid-feedback" *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
          <i class="fas fa-exclamation-circle"></i>
          Ingresa un correo electrónico válido
        </div>
      </div>

      <div class="form-group">
        <label for="nivel_educativo">Nivel educativo</label>
        <div class="input-group">
          <i class="fas fa-graduation-cap"></i>
          <select id="nivel_educativo" formControlName="nivel_educativo">
            <option value="">Selecciona tu nivel</option>
            <option value="secundaria">Secundaria</option>
            <option value="preparatoria">Preparatoria / Bachillerato</option>
            <option value="universidad">Universidad</option>
            <option value="otro">Otro</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-group">
            <i class="fas fa-lock"></i>
            <input 
              [type]="showPassword ? 'text' : 'password'" 
              id="password" 
              formControlName="password" 
              placeholder="Crea una contraseña segura"
              [class.is-invalid]="registerForm.get('password')?.invalid && registerForm.get('password')?.touched"
            >
            <button type="button" class="toggle-password" (click)="showPassword = !showPassword">
              <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
            </button>
          </div>
          <div class="password-strength" *ngIf="registerForm.get('password')?.value">
            <div class="strength-bar" [class]="getPasswordStrength()"></div>
            <span [class]="getPasswordStrength()">{{ getPasswordStrengthText() }}</span>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmar contraseña</label>
          <div class="input-group">
            <i class="fas fa-lock"></i>
            <input 
              [type]="showConfirmPassword ? 'text' : 'password'" 
              id="confirmPassword" 
              formControlName="confirmPassword" 
              placeholder="Repite tu contraseña"
              [class.is-invalid]="registerForm.hasError('mismatch') && registerForm.get('confirmPassword')?.touched"
            >
            <button type="button" class="toggle-password" (click)="showConfirmPassword = !showConfirmPassword">
              <i [class]="showConfirmPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
            </button>
          </div>
        </div>
      </div>

      <div class="invalid-feedback" *ngIf="registerForm.hasError('mismatch') && registerForm.get('confirmPassword')?.touched">
        <i class="fas fa-exclamation-circle"></i>
        Las contraseñas no coinciden
      </div>

      <div class="form-options">
        <label class="terms">
          <input type="checkbox" formControlName="acceptTerms">
          <span>Acepto los <a href="#" target="_blank">Términos y Condiciones</a></span>
        </label>
      </div>

      <button type="submit" class="btn-primary" [disabled]="registerForm.invalid || isLoading">
        <span *ngIf="!isLoading">Registrarse</span>
        <span *ngIf="isLoading" class="spinner"></span>
      </button>

      <div class="auth-footer">
        <p>¿Ya tienes una cuenta? <a routerLink="/auth/login">Inicia sesión aquí</a></p>
      </div>
    </form>
  </div>
</div>
