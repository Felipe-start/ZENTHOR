<div class="auth-container">
  <div class="auth-card animate-scale">
    <div class="auth-header">
      <div class="logo-container">
        <img 
          src="assets/images/ LOGO.jpg" 
          alt="ZENTHOR Logo" 
          class="logo animate-float"
          (error)="handleImageError($event)"
        >
      </div>
      <h6>Organiza tu vida académica</h6>
    </div>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <!-- Campo Email -->
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <div class="input-group">
          <i class="fas fa-envelope"></i>
          <input 
            id="email"
            type="email" 
            formControlName="email" 
            placeholder="tu@email.com"
            [class.is-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
          >
        </div>
        <div class="invalid-feedback" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          <i class="fas fa-exclamation-circle"></i>
          Ingresa un correo electrónico válido
        </div>
      </div>

      <!-- Campo Password -->
      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input 
            id="password"
            [type]="showPassword ? 'text' : 'password'" 
            formControlName="password" 
            placeholder="••••••••"
            [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          >
          <button type="button" class="toggle-password" (click)="showPassword = !showPassword">
            <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
          </button>
        </div>
        <div class="invalid-feedback" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          <i class="fas fa-exclamation-circle"></i>
          La contraseña debe tener al menos 6 caracteres
        </div>
      </div>

      <!-- Opciones -->
      <div class="form-options">
        <label class="checkbox-label">
          <input type="checkbox" formControlName="rememberMe">
          <span>Recordarme</span>
        </label>
        <a routerLink="/auth/forgot-password" class="forgot-link">¿Olvidaste tu contraseña?</a>
      </div>

      <!-- Botón Submit -->
      <button type="submit" class="btn-primary" [disabled]="loginForm.invalid || isLoading">
        <span *ngIf="!isLoading">Iniciar Sesión</span>
        <span *ngIf="isLoading" class="spinner"></span>
      </button>

      <!-- Footer -->
      <div class="auth-footer">
        <p>¿No tienes una cuenta? <a routerLink="/auth/register">Regístrate aquí</a></p>
      </div>
    </form>
  </div>
</div>
