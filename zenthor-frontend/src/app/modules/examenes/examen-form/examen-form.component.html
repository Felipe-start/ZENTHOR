<div class="container mt-4">
  <div class="card shadow-sm">
    <div class="card-header bg-white py-3">
      <h3 class="mb-0">{{ esEdicion ? '✏️ Editar Examen' : '➕ Nuevo Examen' }}</h3>
    </div>
    <div class="card-body">
      <form [formGroup]="examenForm" (ngSubmit)="guardar()">
        <div class="mb-3">
          <label class="form-label required">Materia</label>
          <select class="form-select" formControlName="materia_id">
            <option value="">Selecciona una materia</option>
            <option *ngFor="let materia of materias" [value]="materia.id">
              {{ materia.nombre }}
            </option>
          </select>
          <div class="text-danger" *ngIf="examenForm.get('materia_id')?.invalid && examenForm.get('materia_id')?.touched">
            La materia es obligatoria
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label required">Fecha y hora del examen</label>
          <input type="datetime-local" class="form-control" formControlName="fecha_examen">
          <div class="text-danger" *ngIf="examenForm.get('fecha_examen')?.invalid && examenForm.get('fecha_examen')?.touched">
            Fecha y hora obligatorias
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Aula (opcional)</label>
          <input type="text" class="form-control" formControlName="aula" placeholder="Ej: Laboratorio 301">
        </div>

        <div class="mb-3">
          <label class="form-label">Temas a evaluar (opcional)</label>
          <textarea class="form-control" rows="3" formControlName="temas" 
                    placeholder="Describe los temas que entrarán en el examen..."></textarea>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary" [disabled]="cargando">
            <span *ngIf="cargando" class="spinner-border spinner-border-sm me-1"></span>
            {{ esEdicion ? 'Actualizar' : 'Guardar' }}
          </button>
          <button type="button" class="btn btn-secondary" routerLink="/examenes">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
</div>
