<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="gradient-text">📝 Mis Exámenes</h2>
    <button class="btn btn-primary" (click)="nuevoExamen()">
      <i class="fas fa-plus"></i> Nuevo Examen
    </button>
  </div>

  <div *ngIf="cargando" class="text-center py-5">
    <div class="spinner-border text-primary" role="status"></div>
  </div>

  <div *ngIf="!cargando && examenes.length === 0" class="text-center py-5">
    <i class="fas fa-calendar-alt fa-3x text-muted mb-3"></i>
    <p class="lead">No tienes exámenes registrados.</p>
    <button class="btn btn-outline-primary" (click)="nuevoExamen()">Crear primer examen</button>
  </div>

  <div class="row" *ngIf="!cargando && examenes.length > 0">
    <div class="col-md-6 col-lg-4 mb-4" *ngFor="let examen of examenes">
      <div class="card h-100 shadow-sm hover-lift">
        <div class="card-header" [style.borderLeft]="'4px solid ' + examen.materia_color">
          <h5 class="mb-0">{{ examen.materia_nombre }}</h5>
        </div>
        <div class="card-body">
          <p class="mb-2">
            <i class="fas fa-calendar-day text-primary me-2"></i>
            <strong>Fecha:</strong> {{ formatearFecha(examen.fecha_examen) }}
          </p>
          <p class="mb-2" *ngIf="examen.aula">
            <i class="fas fa-door-open text-primary me-2"></i>
            <strong>Aula:</strong> {{ examen.aula }}
          </p>
          <p class="mb-0" *ngIf="examen.temas">
            <i class="fas fa-book-open text-primary me-2"></i>
            <strong>Temas:</strong> {{ examen.temas }}
          </p>
        </div>
        <div class="card-footer bg-white d-flex justify-content-end gap-2">
          <button class="btn btn-sm btn-outline-primary" (click)="editarExamen(examen.id)">
            <i class="fas fa-edit"></i> Editar
          </button>
          <button class="btn btn-sm btn-outline-danger" (click)="eliminarExamen(examen.id)">
            <i class="fas fa-trash"></i> Eliminar
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
